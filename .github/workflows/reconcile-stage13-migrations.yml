name: Reconcile exact Stage 13 migration sources

on:
  push:
    branches:
      - mrcip/phase-0-audit
    paths:
      - .github/workflows/reconcile-stage13-migrations.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-recovery-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: zjrzzvakwrwkrcqhcnyo
      PGPASSWORD: local-recovery-only

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: mrcip/phase-0-audit

      - name: Verify required Supabase recovery secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret is not configured: $name" >&2
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link hosted Supabase project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Dump authoritative migration history
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest db dump \
            --linked \
            --schema supabase_migrations \
            --file /tmp/migration_history_schema.sql
          npx --yes supabase@latest db dump \
            --linked \
            --schema supabase_migrations \
            --data-only \
            --use-copy \
            --file /tmp/migration_history_data.sql

      - name: Restore migration history into isolated local Postgres
        shell: bash
        run: |
          set -euo pipefail
          psql \
            --host 127.0.0.1 \
            --port 5432 \
            --username postgres \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --file /tmp/migration_history_schema.sql \
            --file /tmp/migration_history_data.sql

      - name: Recover exact Stage 13c and 13d SQL bodies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations

          recover_one() {
            local version="$1"
            local name="$2"
            local expected_sha="$3"
            local output="supabase/migrations/${version}_${name}.sql"
            local encoded

            encoded="$(psql \
              --host 127.0.0.1 \
              --port 5432 \
              --username postgres \
              --dbname postgres \
              --no-align \
              --tuples-only \
              --quiet \
              --command "select replace(encode(convert_to(statements[1],'UTF8'),'base64'), E'\\n','') from supabase_migrations.schema_migrations where version='${version}';")"

            if [ -z "$encoded" ]; then
              echo "Hosted migration body not found for ${version}" >&2
              exit 1
            fi

            printf '%s' "$encoded" | base64 --decode > "$output"

            local actual_sha
            actual_sha="$(git hash-object "$output")"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "Hash mismatch for ${output}: expected ${expected_sha}, got ${actual_sha}" >&2
              rm -f "$output"
              exit 1
            fi

            echo "Verified ${output}: ${actual_sha}"
          }

          recover_one \
            20260821060927 \
            mrcip_stage_13c_evaluation_workflow_engine \
            4bafdf0acbee619e4949bd21ab7b6eb5a49f3635

          recover_one \
            20260821061049 \
            mrcip_stage_13d_provider_onboarding_budget_and_activation_gates \
            3e986530652939cd381d1c337e548c14f50bb9eb

      - name: Commit exact recovery and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-stage13-migrations.yml
          git add \
            supabase/migrations/20260821060927_mrcip_stage_13c_evaluation_workflow_engine.sql \
            supabase/migrations/20260821061049_mrcip_stage_13d_provider_onboarding_budget_and_activation_gates.sql

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recover exact Stage 13c and 13d hosted migrations"
          git push origin HEAD:mrcip/phase-0-audit
