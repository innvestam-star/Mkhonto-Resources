name: Recover exact Stage 13 authoritative migrations

on:
  push:
    branches:
      - mrcip/phase-0-audit
    paths:
      - .github/workflows/recover-stage13-authoritative.yml

permissions:
  actions: read
  contents: write

jobs:
  recover:
    if: github.event.head_commit.message != 'Recover exact Stage 13c and 13d hosted migrations'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXPORT_URL: https://zjrzzvakwrwkrcqhcnyo.supabase.co/functions/v1/mrcip-stage13-export
    steps:
      - name: Check out controlled branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: mrcip/phase-0-audit

      - name: Fetch authoritative hosted migration bodies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations

          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Run-Id: ${GITHUB_RUN_ID}" \
            "${EXPORT_URL}?version=20260821060927" \
            -o supabase/migrations/20260821060927_mrcip_stage_13c_evaluation_workflow_engine.sql

          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Run-Id: ${GITHUB_RUN_ID}" \
            "${EXPORT_URL}?version=20260821061049" \
            -o supabase/migrations/20260821061049_mrcip_stage_13d_provider_onboarding_budget_and_activation_gates.sql

      - name: Verify exact hosted Git blob identities
        shell: bash
        run: |
          set -euo pipefail

          actual_13c="$(git hash-object supabase/migrations/20260821060927_mrcip_stage_13c_evaluation_workflow_engine.sql)"
          actual_13d="$(git hash-object supabase/migrations/20260821061049_mrcip_stage_13d_provider_onboarding_budget_and_activation_gates.sql)"

          test "$actual_13c" = "4bafdf0acbee619e4949bd21ab7b6eb5a49f3635"
          test "$actual_13d" = "3e986530652939cd381d1c337e548c14f50bb9eb"

          echo "Stage 13c verified: ${actual_13c}"
          echo "Stage 13d verified: ${actual_13d}"

      - name: Commit exact migration recovery and remove transient artifacts
        shell: bash
        run: |
          set -euo pipefail

          git rm .github/workflows/recover-stage13-authoritative.yml
          if [ -f docs/mrcip/STAGE_13_PROVENANCE_RECOVERY_FAILURE.md ]; then
            git rm docs/mrcip/STAGE_13_PROVENANCE_RECOVERY_FAILURE.md
          fi

          git add -- \
            supabase/migrations/20260821060927_mrcip_stage_13c_evaluation_workflow_engine.sql \
            supabase/migrations/20260821061049_mrcip_stage_13d_provider_onboarding_budget_and_activation_gates.sql

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recover exact Stage 13c and 13d hosted migrations"
          git push origin HEAD:mrcip/phase-0-audit
