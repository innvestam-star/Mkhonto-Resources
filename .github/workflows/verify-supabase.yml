name: Verify Supabase connection

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://zjrzzvakwrwkrcqhcnyo.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpqcnp6dmFrd3J3a3JjcWhjbnlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODI4NzEsImV4cCI6MjEwMTM1ODg3MX0.Nn3mKviiJL9C6jg1n9ZvImzbx4LjJeX5MFCfCncNHCc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Supabase REST API
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=0" \
            > /dev/null

      - name: Verify Supabase Auth service
        shell: bash
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/auth/v1/health" \
            > /dev/null

      - name: Verify Google Search Console file
        shell: bash
        run: |
          test -f google0f5aff3a23595204.html
          grep -Fxq \
            "google-site-verification: google0f5aff3a23595204.html" \
            google0f5aff3a23595204.html
