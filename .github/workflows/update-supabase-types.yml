name: Update Supabase database types

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 1"

permissions:
  contents: write

jobs:
  update-types:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: zjrzzvakwrwkrcqhcnyo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate database types
        shell: bash
        run: |
          mkdir -p src/types
          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_REF" \
            --schema public \
            > src/types/database.types.ts

      - name: Commit updated types
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Database types are already current."
            exit 0
          fi

          git add src/types/database.types.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Supabase database types"
          git push
